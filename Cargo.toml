[package]
name = "wrangler"
version = "0.1.0"
edition = "2021"
description = "tmux-agent-wrangler: a tmux sidebar for AI-agent sessions (Rust rewrite)"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order stable, so merging into a user's shared
# settings.json does not reshuffle their keys.
serde_json = { version = "1", features = ["preserve_order"] }
# Ordered map for the deterministic-iteration parity requirement (registry
# order, title-collision tiebreaks, notification order).
indexmap = { version = "2", features = ["serde"] }
# Liveness probe for a recorded agent pid via kill(pid, 0).
libc = "0.2"
# The client's terminal UI (bundles crossterm as ratatui::crossterm).
ratatui = "0.30"
